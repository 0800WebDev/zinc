<script>
function applyChanges() {
  const title = document.getElementById("titleInput").value;
  const favicon = document.getElementById("faviconInput").value;

  document.title = title;

  let link = document.querySelector("link[rel~='icon']");
  if (!link) {
    link = document.createElement("link");
    link.rel = "icon";
    document.head.appendChild(link);
  }

  link.href = favicon;
}
</script>



<script src="extension-importer.js"></script>
    

<script>
  // Vercel Web Analytics loader
  window.va = window.va || function () {
    (window.vaq = window.vaq || []).push(arguments);
  };

  // Wait until Vercel Analytics is ready
  window.addEventListener("load", () => {
    const wispServer = localStorage.getItem("wispServer");

    if (wispServer) {
      va("event", "wisp_server_used", {
        server: wispServer
      });
    } else {
      va("event", "wisp_server_used", {
        server: "unknown"
      });
    }
  });

  // Function you can call when your proxy changes Wisp servers
  window.trackWispServer = function(server) {
    localStorage.setItem("wispServer", server);

    va("event", "wisp_server_changed", {
      server: server
    });
  };
</script>
