<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Zinc new tab, default starting page.">
  <title>Zinc | New Tab</title>
  <link rel="icon" href="Zinc.png">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap');
    html, body {
      margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        background-color: #1a1a1a;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover; /* Ensures image is full screen */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #000;
        transition: background 0.3s ease-in-out;
        font-family: sans-serif;    }

    .glass-panel {
  width: 90%;
  max-width: 700px;
  background: rgba(80, 80, 80, 0.35);
    border:1px solid #444;
  border-radius:8px;
  backdrop-filter:blur(8px);
  padding:30px;
  text-align: center;
    }

    h1 {
       font-size: 4rem;
        margin: 0;
        letter-spacing: 9px;
        font-weight: 900;

      
       text-align:center;
  font-family:'Sora',sans-serif;

  background:
    linear-gradient(
      115deg,
      #4a4a4a 0%,
      #ffffff 10%,
      #7a7a7a 18%,
      #f5f5f5 25%,
      #8c8c8c 32%,
      #ffffff 40%,
      #5e5e5e 50%,
      #ffffff 60%,
      #9a9a9a 68%,
      #f0f0f0 76%,
      #6e6e6e 85%,
      #ffffff 100%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-size:300% auto;
  animation:chrome 42s ease-in-out infinite alternate;
}

@keyframes chrome{
  from{background-position:0% 50%;}
  to{background-position:100% 50%;}
}


    .time-container { margin: 10px 0 30px 0; }
    .clock { font-size: 3rem; font-weight: 700; color: white; }
    .date { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; opacity: 0.7; }

    .search-container {
        display: flex;
        align-items: center;
        width: 100%;
        margin-bottom: 40px;
        position: relative;
    }

    .search-bar {
        width: 100%;
      
    padding: 10px 15px;
    font-size: 16px;
    border: 1px solid #555;
    border-radius: 8px;
    background-color: rgba(0, 0, 0, 0.6);
    color: whitesmoke;
    outline: none;
    box-shadow: 0 0 5px rgba(255,255,255,0.2);
    transition: all 0.3s ease;
      text-align: center;
       display: block;
  margin: 0 auto;
    }

    #engine {
        position: absolute;
        right: 15px;
        background: #1a1a1a;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 5px 10px;
        cursor: pointer;
    }

    .shortcuts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
        gap: 15px;
        width: 100%;
    }

    .shortcut {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: #1a1a1a;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .shortcut:hover { transform: translateY(-5px); }

    .shortcut-icon {
      
        color: #FAFAFA;
      
        width: 50px;
        height: 50px;
        border: 2px solid #1a1a1a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        background: rgba(255,255,255,0.3);
    }

    .shortcut-icon img { width: 24px; height: 24px; border-radius: 4px; }
    .shortcut-label {color: #FAFAFA; font-size: 0.65rem; font-weight: 900; text-transform: uppercase; text-align: center; }

    .quote {color: white; margin-top: 30px; font-size: 0.9rem; font-style: italic; opacity: 0.7; }

    .loader {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.9);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
    }
    .loader.show { display: flex; }
    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #000;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
     .date { color: white;}

      
      
      .title {
    position: relative;
}
      
      .logo {
    position: absolute;
    left: 10px; 
    top: 50%;
    transform: translateY(-50%);
    height: 75%;
    width: auto;
      }

      
  </style>
</head>

<body>
  <div class="loader" id="loader"><div class="spinner"></div></div>

  <div class="glass-panel">
    
<div class="title">
   <h1>Zinc</h1>
</div>
  <strong>This will NOT unblock the site, it will only embedd it and might still get blocked.</strong>
    <form class="search-container" id="searchForm">
      <img src="Zinc.png" alt="Zinc Browser logo" class="logo">
      <input type="text" id="searchInput" class="search-bar" placeholder="Enter any url..." autocomplete="off">
    </form>
  </div>


  <script>
(() => {
    const input = document.querySelector("#searchInput");
    if (!input) return;

    let url = input.value.trim();
    if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
    }

    document.documentElement.innerHTML = "";

    document.body.style.margin = "0";
    document.body.style.background = "#666";
    document.body.style.overflow = "hidden";

    const container = document.createElement("div");
    container.style.position = "fixed";
    container.style.inset = "0";
    container.style.padding = "12px";
    container.style.boxSizing = "border-box";

    const frame = document.createElement("iframe");
    frame.src = url;
    frame.style.width = "100%";
    frame.style.height = "100%";
    frame.style.border = "2px solid #888";
    frame.style.borderRadius = "6px";
    frame.style.background = "#fff";

    const preview = document.createElement("div");
    preview.textContent = "Preview";
    preview.style.position = "fixed";
    preview.style.top = "16px";
    preview.style.left = "20px";
    preview.style.color = "#fff";
    preview.style.font = "14px sans-serif";
    preview.style.pointerEvents = "none";
    preview.style.zIndex = "9999";

    const loadedUrl = document.createElement("div");
    loadedUrl.textContent = url;
    loadedUrl.style.position = "fixed";
    loadedUrl.style.top = "16px";
    loadedUrl.style.right = "20px";
    loadedUrl.style.color = "#fff";
    loadedUrl.style.font = "14px sans-serif";
    loadedUrl.style.pointerEvents = "none";
    loadedUrl.style.zIndex = "9999";
    loadedUrl.style.maxWidth = "50vw";
    loadedUrl.style.overflow = "hidden";
    loadedUrl.style.textOverflow = "ellipsis";
    loadedUrl.style.whiteSpace = "nowrap";
    loadedUrl.style.textAlign = "right";

    container.appendChild(frame);
    document.body.append(container, preview, loadedUrl);
})();
  </script>
</body>
</html>
