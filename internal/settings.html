<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="https://zinc-browser.vercel.app/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <style>
      body {
        background: black;
      }
      #menu {
    position: fixed;
    left: 0;
    top: 0vh;
    background: black;
    border: 1px solid #444;
    border-radius: 8px;
    min-width: 170px;
    z-index: 1000;
    height: 100vh;
    display: flex;
    flex-direction: column;
    
      }
      #menu button {
            display: flex;
    align-items: center;
    gap: 20px;
    width: 100%;
    padding: 17px 10px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
        border-radius: 8px;
      }
      #menu button:hover {
    background: #333;
}
      hr {
    width: 100%;
    border: 0;
    border-top: 1px solid;
    flex-shrink: 0;
}
  #content {
    position: fixed;
    height: 100dvh;
    width: calc(100vw - 170px);
    background: black;
    color: white;
    bottom: 0px;
    right: 0px;
  }

      .settings-content {
    margin: 0 auto;
    width: 60%;
    height: 100%;
    max-height: none;
      }
      .settings-button {
        color: black !important;
        width: 100%
      }
    
    .tab-preset {
      height: 25px;
      width: 25px;
      cursor: pointer;
      margin: 0 10px;
    }
    .settings-header {
        border-top: 1px solid #444;
    }
    </style>
  </head>
  <body>
<div id="menu">
 

        <button onclick="general()"><i class="fa-solid fa-gear"></i>General</button>
<button onclick="proxy()"><i class="fa-solid fa-globe"></i> Proxy</button>
<button onclick="theme()"><i class="fa-solid fa-palette"></i> Theme</button>
 <button onclick="extensions()">
    <i class="fa-solid fa-puzzle-piece"></i> Extensions</button>

  
</div>

<div id="content">
</div>
    
  <script>
function general() {
  document.getElementById("content").innerHTML = `
  <div class="settings-header">
                <h2><i class="fa-solid fa-gear"></i>General</h2>
            </div>
            <div class="settings-content">
               
                <div class="section-title"> Tab title</div>
                <div class="custom-input-group">
                    <input type="text" id="titleInput" placeholder="Google Classroom">
                </div>
<br>
<div class="section-title">Favicon</div>
                <div class="custom-input-group">
                    <input type="text" id="faviconInput" placeholder="favicon.ico">
                </div>
                <br>
                <div class="section-title">Presets</div>
                <img class="tab-preset" src="https://zinc-browser.vercel.app/Zinc.png" onclick="setTabPreset('zinc')"> <img class="tab-preset" src="https://google.com/favicon.ico" onclick="setTabPreset('google')"> <img class="tab-preset" src="https://ssl.gstatic.com/classroom/favicon.png" onclick="setTabPreset('classroom')"> <img class="tab-preset" src="https://ssl.gstatic.com/docs/documents/images/docs-favicon-2026-v2.ico" onclick="setTabPreset('docs')"> <img class="tab-preset" src="https://ssl.gstatic.com/images/branding/productlogos/drive_2026/v2/ico/drive_2026_256dp.ico" onclick="setTabPreset('drive')"> <img class="tab-preset" src="https://ssl.gstatic.com/ui/v1/icons/mail/images/favicon_gmail_2026_v2.ico" onclick="setTabPreset('gmail')"> <img class="tab-preset" src="https://raw.githubusercontent.com/chromium/chromium/main/chrome/app/theme/default_100_percent/common/favicon_ntp.png" onclick="setTabPreset('newtab')"> <img class="tab-preset" src="https://www.wikipedia.org/static/favicon/wikipedia.ico" onclick="setTabPreset('wikipedia')">
<br>
                <br>
                <div class="custom-input-group" style=" display: flex; justify-content: center; text-align: center;">
<button onclick="applyChanges()" class="settings-button">Apply</button>
                </div>
            </div>
  `
}
general()

function proxy() {
  document.getElementById("content").innerHTML = `
    <div class="settings-header">
                <h2><i class="fa-solid fa-globe"></i>Proxy</h2>
            </div>
  `
}

    function theme() {
  document.getElementById("content").innerHTML = `
    <div class="settings-header">
                <h2><i class="fa-solid fa-palette"></i>Theme</h2>
            </div>
  `
    }

      function extensions() {
  document.getElementById("content").innerHTML = `
    <div class="settings-header">
                <h2><i class="fa-solid fa-puzzle-piece"></i>Extensions</h2>
            </div>
  `
      }









    

function applyChanges() {
  const title = document.getElementById("titleInput").value;
  const favicon = document.getElementById("faviconInput").value;

  window.parent.document.title = title;

  let link = window.parent.document.querySelector("link[rel~='icon']");
  if (!link) {
    link = window.parent.document.createElement("link");
    link.rel = "icon";
    window.parent.document.head.appendChild(link);
  }

  link.href = favicon;

  localStorage.setItem("pageTitle", title);
  localStorage.setItem("pageFavicon", favicon);

  document.getElementById("titleInput").value = "";
  document.getElementById("faviconInput").value = "";
}


    function setTabPreset(tab) {
      const TabPreset = tab;
      if (TabPreset === "zinc") {
      document.getElementById("titleInput").value = "Zinc";
      document.getElementById("faviconInput").value = "/Zinc.png";
      } else if (TabPreset === "google") {
      document.getElementById("titleInput").value = "Google";
      document.getElementById("faviconInput").value = "https://google.com/favicon.ico";
      } else if (TabPreset === "classroom") {
      document.getElementById("titleInput").value = "Google Classroom";
      document.getElementById("faviconInput").value = "https://ssl.gstatic.com/classroom/favicon.png";
      } else if (TabPreset === "docs") {
      document.getElementById("titleInput").value = "Google Docs";
      document.getElementById("faviconInput").value = "https://ssl.gstatic.com/docs/documents/images/docs-favicon-2026-v2.ico";
      } else if (TabPreset === "drive") {
      document.getElementById("titleInput").value = "Google Drive";
      document.getElementById("faviconInput").value = "https://ssl.gstatic.com/images/branding/productlogos/drive_2026/v2/ico/drive_2026_256dp.ico";
      } else if (TabPreset === "gmail") {
      document.getElementById("titleInput").value = "Gmail";
      document.getElementById("faviconInput").value = "https://ssl.gstatic.com/ui/v1/icons/mail/images/favicon_gmail_2026_v2.ico";
      } else if (TabPreset === "newtab") {
      document.getElementById("titleInput").value = "New Tab";
      document.getElementById("faviconInput").value = "https://raw.githubusercontent.com/chromium/chromium/main/chrome/app/theme/default_100_percent/common/favicon_ntp.png";
      } else if (TabPreset === "wikipedia") {
      document.getElementById("titleInput").value = "Wikipedia";
      document.getElementById("faviconInput").value = "https://www.wikipedia.org/static/favicon/wikipedia.ico";
      }
      applyChanges()
    }
    
  </script>
  </body>
</html>
