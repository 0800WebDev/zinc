<button onclick="applyChanges()" class="settings-button" id="applyButton">Apply</button>

  const titleInput = document.getElementById("titleInput");

titleInput.value = localStorage.getItem("pageTitle") || "";

//tab cloak


    

function applyChanges() {
  const title = document.getElementById("titleInput").value;
  const favicon = document.getElementById("faviconInput").value;

  window.parent.document.title = title;

  let link = window.parent.document.querySelector("link[rel~='icon']");
  if (!link) {
    link = window.parent.document.createElement("link");
    link.rel = "icon";
    window.parent.document.head.appendChild(link);
  }

  link.href = favicon;

  localStorage.setItem("pageTitle", title);
  localStorage.setItem("pageFavicon", favicon);

  
const applyBtn = document.getElementById("applyButton");

applyBtn.textContent = "Saved!";

setTimeout(() => {
  applyBtn.textContent = "Apply";
}, 1000);
  }


    function setTabPreset(tab) {
      const TabPreset = tab;
      if (TabPreset === "zinc") {
      document.getElementById("titleInput").value = "Zinc";
      document.getElementById("faviconInput").value = "/Zinc.png";
      } else if (TabPreset === "google") {
      document.getElementById("titleInput").value = "Google";
      document.getElementById("faviconInput").value = "https://google.com/favicon.ico";
      } else if (TabPreset === "classroom") {
      document.getElementById("titleInput").value = "Google Classroom";
      document.getElementById("faviconInput").value = "https://ssl.gstatic.com/classroom/favicon.png";
      } else if (TabPreset === "docs") {
      document.getElementById("titleInput").value = "Google Docs";
      document.getElementById("faviconInput").value = "https://ssl.gstatic.com/docs/documents/images/docs-favicon-2026-v2.ico";
      } else if (TabPreset === "drive") {
      document.getElementById("titleInput").value = "Google Drive";
      document.getElementById("faviconInput").value = "https://ssl.gstatic.com/images/branding/productlogos/drive_2026/v2/ico/drive_2026_256dp.ico";
      } else if (TabPreset === "gmail") {
      document.getElementById("titleInput").value = "Gmail";
      document.getElementById("faviconInput").value = "https://ssl.gstatic.com/ui/v1/icons/mail/images/favicon_gmail_2026_v2.ico";
      } else if (TabPreset === "newtab") {
      document.getElementById("titleInput").value = "New Tab";
      document.getElementById("faviconInput").value = "https://raw.githubusercontent.com/chromium/chromium/main/chrome/app/theme/default_100_percent/common/favicon_ntp.png";
      } else if (TabPreset === "wikipedia") {
      document.getElementById("titleInput").value = "Wikipedia";
      document.getElementById("faviconInput").value = "https://www.wikipedia.org/static/favicon/wikipedia.ico";
      }
      applyChanges()
    }




    //theme


function fitPreview() {
  const iframe = document.getElementById("bg-preview");

  if (!iframe) return;

  iframe.onload = () => {
    const doc = iframe.contentDocument;
    const html = doc.documentElement;
    const body = doc.body;

    html.style.overflow = "hidden";
    body.style.overflow = "hidden";

    html.style.margin = "0";
    body.style.margin = "0";

    const pageWidth = Math.max(
      html.scrollWidth,
      body.scrollWidth
    );

    const pageHeight = Math.max(
      html.scrollHeight,
      body.scrollHeight
    );

    const scale = Math.min(
      iframe.clientWidth / pageWidth,
      iframe.clientHeight / pageHeight
    );

    html.style.transform = `scale(${scale})`;
    html.style.transformOrigin = "top left";
    html.style.width = `${100 / scale}%`;
    html.style.height = `${100 / scale}%`;
  };
}


function reloadPreview() {
  const oldPreview = document.getElementById("bg-preview");

  if (!oldPreview) return;

  const newPreview = oldPreview.cloneNode(true);
  newPreview.src = "/NT.html?" + Date.now();

  oldPreview.replaceWith(newPreview);

  fitPreview();
}

    

    
    function upload() {
  const uploadBtn = document.getElementById("uploadBtn");
  const resetBtn = document.getElementById("resetBtn");

  const bgUpload = document.createElement("input");
  bgUpload.type = "file";
  bgUpload.accept = "image/*";
  bgUpload.style.display = "none";
  document.body.appendChild(bgUpload);

  uploadBtn.onclick = () => {
    bgUpload.click();
  };

  resetBtn.onclick = () => {
    localStorage.removeItem("customBg");
    reloadPreview();
  };

  bgUpload.onchange = e => {
    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = event => {
      try {
        localStorage.setItem("customBg", event.target.result);
        reloadPreview();
      } catch (err) {
        alert("Image too large! Try a smaller file.");
      }
    };

    reader.readAsDataURL(file);
  };
    }
  </script>
