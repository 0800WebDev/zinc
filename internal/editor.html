<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Editor</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css"
        />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #1e1e1e;
                color: #fff;
                font-family: sans-serif;
            }
            #bar {
                display: flex;
                gap: 8px;
                padding: 8px;
                background: #2b2b2b;
            }
            #editor {
                flex: 1;
                min-height: 0;
            }
            #preview,
            #console {
                flex: 1;
                min-height: 0;
                overflow: auto;
                background: #fff;
                color: #000;
                padding: 10px;
                display: none;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            #console {
                background: #111;
                color: #0f0;
                white-space: pre-wrap;
            }
            input {
                background: #444;
                color: #fff;
                border: 0;
                padding: 6px;
            }
            button {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                background: var(--surface);
                border: none;
                border-radius: 8px;
                color: var(--text-muted);
                cursor: pointer;
                transition: all 0.15s;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div id="bar">
            <input id="filename" value="file.txt" /><button id="save">Save</button><button id="refresh">Run</button>
        </div>
        <div id="editor"></div>
        <div id="preview"></div>
        <div id="console"></div>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
        <script>
            require.config({ paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs" } });
            require(["vs/editor/editor.main"], () => {
                window.editor = monaco.editor.create(document.getElementById("editor"), {
                    value: "",
                    language: "plaintext",
                    theme: "vs-dark",
                    automaticLayout: true,
                });
                const map = {
                    js: "javascript",
                    html: "html",
                    htm: "html",
                    css: "css",
                    json: "json",
                    md: "markdown",
                    py: "python",
                    ts: "typescript",
                    java: "java",
                    cpp: "cpp",
                    c: "c",
                };
                const fn = document.getElementById("filename"),
                    pv = document.getElementById("preview"),
                    co = document.getElementById("console");
                function lang() {
                    let e = fn.value.split(".").pop().toLowerCase();
                    monaco.editor.setModelLanguage(editor.getModel(), map[e] || "plaintext");
                }
                fn.oninput = lang;
                lang();
                document.getElementById("save").onclick = () => {
                    let a = document.createElement("a");
                    a.href = URL.createObjectURL(new Blob([editor.getValue()], { type: "text/plain" }));
                    a.download = fn.value;
                    a.click();
                };
                document.getElementById("refresh").onclick = () => {
                    pv.style.display = "none";
                    co.style.display = "none";
                    let ext = fn.value.split(".").pop().toLowerCase(),
                        txt = editor.getValue();
                    if (ext === "html") {
                        pv.style.display = "block";
                        co.style.display = "none";
                        pv.innerHTML = "";

                        const iframe = document.createElement("iframe");
                        iframe.style.width = "100%";
                        iframe.style.height = "100%";
                        iframe.style.border = "0";
                        iframe.srcdoc = txt;

                        pv.appendChild(iframe);
                    } else if (ext === "md") {
                        pv.style.display = "block";
                        co.style.display = "none";
                        pv.innerHTML = marked.parse(txt);
                    } else if (ext === "js") {
                        co.style.display = "block";
                        pv.style.display = "none";
                        co.textContent = "";
                        let f = document.createElement("iframe");
                        f.sandbox = "allow-scripts";
                        f.style.display = "none";
                        document.body.appendChild(f);
                        window.onmessage = (e) => {
                            if (e.data.t === "c") co.textContent += e.data.m + "\n";
                        };
                        f.srcdoc = `<script>
const s=m=>parent.postMessage({t:"c",m:String(m)},"*");
console.log=(...a)=>s(a.join(" "));
window.onerror=m=>s("ERROR: "+m);
try{
    new Function(${JSON.stringify(txt)})();
}catch(e){
    s("ERROR: " + e);
}
<\/script>`;
                        setTimeout(() => f.remove(), 500);
                    }
                };
            });
        </script>
    </body>
</html>
